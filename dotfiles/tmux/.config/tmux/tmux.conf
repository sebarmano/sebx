# tmux.conf — managed by sebx.

# ── Prefix: Ctrl-a instead of Ctrl-b ──────────────────────────────────────────
unbind-key C-b
set -g prefix C-a
bind -r C-a send-prefix        # press Ctrl-a twice to send a literal Ctrl-a

# ── Splits (open in the current pane's path) ──────────────────────────────────
# prefix + -  : split into top / bottom
# prefix + \  : split into left / right
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# ── New window/tab: prefix + t ────────────────────────────────────────────────
bind t new-window -c "#{pane_current_path}"

# ── Pane navigation without the prefix ────────────────────────────────────────
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# ── Quality of life ────────────────────────────────────────────────────────────
set -g focus-events on
set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes start at 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0          # no delay for escape key

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── Catppuccin theme (manual load; TPM has a name-conflict bug with this plugin) ──
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"                  # truecolor so catppuccin hex renders

set -g @catppuccin_flavor "mocha"                    # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_connect_separator "no"     # separate, fully-rounded pills (not butted together)
set -g @catppuccin_status_right_separator ""  # rounded right cap (default is just a space)

# show working-dir basename (or running command) instead of a program-set title
setw -g automatic-rename off
setw -g allow-rename off
set -g @catppuccin_window_text " #{?#{!=:#W,#{pane_current_command}},#W,#{b:pane_current_path}}"
set -g @catppuccin_window_current_text " #{?#{!=:#W,#{pane_current_command}},#W,#{b:pane_current_path}}"

run ~/.tmux/plugins/tmux/catppuccin.tmux

# ── Status bar: session on the left, active app + clock on the right ─────────
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#[fg=#{@thm_overlay_1}] %H:%M "

# ── Our tweaks, layered on top of Catppuccin ──────────────────────────────────
# single active-pane indicator = background dimming below; borders kept quiet
# (both border styles the same subtle color so the divider is one calm line)
set -gF pane-border-style "fg=#{@thm_surface_0}"
set -gF pane-active-border-style "fg=#{@thm_surface_0}"

# dim inactive panes (muted text + darker bg); focused pane brighter
set -gF window-style "fg=#{@thm_overlay_1},bg=#{@thm_mantle}"
set -gF window-active-style "fg=#{@thm_fg},bg=#{@thm_bg}"

# messages / command prompt
set -gF message-style "bg=#{@thm_surface_0},fg=#{@thm_fg}"
